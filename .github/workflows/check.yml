name: Pārbaudīt stundu sarakstu

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  check:

    runs-on: ubuntu-latest

    steps:

      - name: Iegūt projektu
        uses: actions/checkout@v4

      - name: Iestatīt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalēt nepieciešamo
        run: |
          pip install -r requirements.txt

      - name: Pārbaudīt stundu sarakstu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

        run: |
          python bot.py

      - name: Saglabāt izmaiņas
        run: |

          git config user.name "JAVSK Stundu saraksts"

          git config user.email \
            "javsk-schedule-bot@users.noreply.github.com"

          git add users.json
          git add telegram_offset.txt
          git add last_hash.txt

          if git diff --cached --quiet; then

            echo "Izmaiņu nav."

          else

            git commit \
              -m "Atjaunot stundu saraksta informāciju"

            git push

          fi