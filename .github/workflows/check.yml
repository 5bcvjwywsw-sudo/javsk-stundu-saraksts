name: Pārbaudīt stundu sarakstu

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  check:

    runs-on: ubuntu-latest

    steps:

      - name: Iegūt projektu
        uses: actions/checkout@v4

      - name: Iestatīt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalēt nepieciešamo
        run: |
          pip install -r requirements.txt

      - name: Pārbaudīt stundu sarakstu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

        run: |
          python bot.py

            - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "javsk-schedule-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Izmaiņu nav."
          else
            git commit -m "Atjaunot stundu saraksta informāciju"
            git push
          fi

          if git diff --cached --quiet; then

            echo "Izmaiņu nav."

          else

            git commit \
              -m "Atjaunot stundu saraksta informāciju"

            git push

          fi